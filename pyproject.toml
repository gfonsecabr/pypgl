[build-system]
# Only nanobind 3.0.0 is excluded, not the whole 3.x line. That one release
# (2026-08-22) does not compile on the Windows runner's clang-cl, failing inside
# its own nb_backend.h on a constexpr in the NB_SLOT_ALIAS macro -- pypgl's
# sources are never reached. nanobind 3.0.1 fixed exactly that (the macro now
# spells the pointer `inline ret (*const name)`, since Windows declares the
# CPython function __declspec(dllimport) and its address is then not a constant
# expression) and added a clang-cl job to nanobind's own CI, so the regression
# cannot return silently. The exclusion is kept rather than dropped because a
# floor alone would let a resolver pick the one known-bad version.
requires = ["scikit-build-core>=0.10", "nanobind>=2.0,!=3.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pypgl"
version = "1.9.0"
description = "Python bindings for the Pangolin (pgl) exact geometry library"
# README.md is the user-facing front page rendered on PyPI; pypgl.md is the
# internal design contract and is intentionally not shipped as the description.
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Guilherme D. da Fonseca" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gfonsecabr/pypgl"
Repository = "https://github.com/gfonsecabr/pypgl"
"pgl (C++ library)" = "https://github.com/gfonsecabr/pgl"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pypgl"]
# Keep dev cruft out of the sdist (CI builds wheels from it).
# examples/figures/ holds the same outputs, tracked for the examples' README
# gallery, and examples/notebooks/ is a reading surface with its outputs baked in;
# the sdist is a build input, so both are left out of it.
sdist.exclude = [".ipynb_checkpoints", "**/*.ipynb", ".pytest_cache",
                 "examples/*.svg", "examples/*.pdf", "examples/*.ipe",
                 "examples/figures", "examples/notebooks"]

# pgl is header-only. By default the build uses an in-tree .pgl-ref/include
# checkout if present (offline dev), otherwise CMake FetchContents it. Point at a
# co-developed checkout with:
#   pip install -e . --no-build-isolation -C cmake.define.PGL_INCLUDE_DIR=/path/to/pgl/include

[tool.cibuildwheel]
# pgl is C++20 and header-only with no native deps (its BigInt is pure C++), so a
# wheel build needs only a modern compiler — no system libraries to install.
# The sdist does not ship the gitignored .pgl-ref/, so CMake FetchContents the
# pinned pgl commit (see CMakeLists.txt) during each build.
# cp314 needs cibuildwheel >= 3 (see the pinned action in wheels.yml). The
# pattern is deliberately cp314-*, not cp314t-*, so the free-threaded build is
# left out: nanobind supports it, but it is a separate ABI and a separate wheel
# per platform, and nothing has asked for it yet.
#
# cp39 is gone as of 0.7.0. It was a deliberate choice and not a forced one --
# the nanobind cap then in force held the build on 2.x, which still supports 3.9
# -- but Python 3.9 reached end-of-life in October 2025 and nanobind 3 has
# dropped it, so keeping it would have meant re-adding the wheels only to drop
# them again once the cap lifted. It has since lifted (1.7.0), and nanobind 3.0.1
# requires >= 3.10, so the question is settled either way. Anyone still on 3.9
# can stay on pypgl 0.6.0; requires-python keeps pip from offering them this
# release.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip PyPy (nanobind targets CPython), 32-bit, and musl (lean matrix to start).
skip = "pp* *_i686 *-win32 *-musllinux_*"
build-frontend = "build"
# nanobind_add_stub imports the freshly built _pgl to emit _pgl.pyi, so the wheel
# is verified importable on every target during the build itself; also run tests.
test-requires = "pytest"
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.linux]
# manylinux_2_28 ships GCC 12 (full C++20); the legacy 2014 image's GCC 10 is not
# enough. Native x86_64 only — no aarch64 emulation, since stub generation has to
# import (i.e. run) the built extension on the build host.
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# MSVC lacks __int128, so pgl would fall back to Boost.Multiprecision (not
# installed). Build with the LLVM/ClangCL toolset instead: clang defines
# __SIZEOF_INT128__ on x64, so pgl takes the native __int128 path and never
# pulls in Boost, while clang-cl still emits an MSVC-ABI extension. The VS
# generator is forced (so CMAKE_GENERATOR_TOOLSET is honored — Ninja ignores it);
# the runner is pinned to windows-2022 in the workflow so this generator name is
# stable.
environment = { CMAKE_GENERATOR = "Visual Studio 17 2022", CMAKE_GENERATOR_TOOLSET = "ClangCL" }
